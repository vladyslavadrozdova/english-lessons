<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Interactive food vocabulary practice with drag-and-drop and typed answers.">
  <title>Food Vocabulary — Drag & Drop Exercise</title>
  <style>
    :root{--ink:#20231d;--muted:#697064;--cream:#f4f1e7;--card:#fffef9;--lime:#dffc63;--forest:#1c3c2f;--line:#dcdcd1;--red:#c84c4c;--green:#20825f}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 6% 4%,rgba(223,252,99,.34),transparent 26rem),var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}.page{width:min(1240px,calc(100% - 32px));margin:auto;padding:48px 0 72px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:26px}.eyebrow{margin:0 0 10px;color:#536128;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(42px,6vw,74px);font-weight:500;line-height:.98;letter-spacing:-.055em}.intro{max-width:680px;margin:16px 0 0;color:var(--muted);font-size:17px;line-height:1.55}.score{flex:0 0 auto;min-width:116px;padding:14px 18px;border:1px solid #cdd2bd;border-radius:18px;background:rgba(255,255,255,.54);text-align:center}.score span{display:block;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.score strong{display:block;margin-top:3px;font-size:25px;font-variant-numeric:tabular-nums}.score.active{background:var(--lime);border-color:#b9df31}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 330px;align-items:start;gap:22px}.card{overflow:hidden;border:1px solid var(--line);border-radius:28px;background:var(--card);box-shadow:0 20px 60px rgba(52,57,43,.08)}.card-head,.bank-head{display:flex;align-items:center;justify-content:space-between;gap:18px}.card-head{padding:22px 28px;border-bottom:1px solid #e5e5db}.card-head>div,.bank-head>div{display:flex;align-items:center;gap:12px}.card-head h2,.bank h2{margin:0;font-size:18px}.pill{display:inline-flex;align-items:center;min-height:27px;padding:5px 9px;border-radius:999px;background:var(--lime);color:#334014;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.mode{color:var(--muted);font-size:12px;font-weight:700}.sentences{display:grid;margin:0;padding:8px 28px;list-style:none}.sentence{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:17px 0;border-bottom:1px solid #ecece3}.sentence:last-child{border-bottom:0}.num{padding-top:10px;color:#a1a597;font-size:11px;font-weight:800}.line{color:#33362f;font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:2.25}.gap{position:relative;display:inline-flex;align-items:center;width:min(310px,100%);min-height:42px;margin:0 6px;vertical-align:middle;border:1.5px dashed #aeb79b;border-radius:11px;background:#f7f8f1;transition:.15s}.gap:focus-within{border-color:#6f8522;background:#fbffe9;box-shadow:0 0 0 3px rgba(185,223,49,.18)}.gap input{width:100%;min-width:0;padding:9px 36px 9px 12px;border:0;outline:0;background:transparent;color:var(--ink);font-family:Inter,sans-serif;font-size:14px;font-weight:700}.gap input::placeholder{color:#a0a596;font-weight:500}.gap.correct{border-style:solid;border-color:#63ad8b;background:#eaf8f1}.gap.wrong{border-style:solid;border-color:#df8a8a;background:#fff0f0}.clear{position:absolute;right:7px;display:grid;width:25px;height:25px;place-items:center;border:0;border-radius:50%;background:#e8e9df;color:#6e7268;cursor:pointer;font-size:18px}.correction{display:block;margin:-5px 0 -6px;color:var(--red);font-family:Inter,sans-serif;font-size:12px;font-weight:700;line-height:1.4}.actions{display:flex;gap:10px;padding:22px 28px;border-top:1px solid #e5e5db}.btn{min-height:46px;padding:11px 18px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:800}.primary{border:1px solid var(--forest);background:var(--forest);color:#fff}.ghost{border:1px solid #d6d8ce;background:transparent;color:#555b50}.result{display:none;margin:0 28px 25px;padding:13px 15px;border-radius:12px;background:#fff0f0;color:#9d3434;font-size:13px;font-weight:700}.result.show{display:block}.result.perfect{background:#e7f8ef;color:#176748}.bank{position:sticky;top:20px;overflow:hidden;border-radius:28px;background:var(--forest);color:#fff;box-shadow:0 20px 60px rgba(24,46,36,.17)}.bank-head{padding:22px 22px 0}.bank .pill{background:rgba(255,255,255,.14);color:#eaf4ee}.bank h2{color:#fff}.counter{display:grid;min-width:44px;height:32px;place-items:center;border-radius:999px;background:var(--lime);color:#293514;font-size:12px;font-weight:900}.help{margin:11px 22px 17px;color:#b9c9c0;font-size:12px}.words{display:grid;gap:7px;max-height:calc(100vh - 185px);overflow-y:auto;padding:0 12px 14px;scrollbar-width:thin}.chip{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:43px;padding:9px 9px 9px 13px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.07);color:#f9fcfa;cursor:grab;text-align:left;font-size:13px;font-weight:700;transition:.15s}.chip:hover{background:rgba(255,255,255,.13);transform:translateX(-2px)}.chip.selected{border-color:var(--lime);background:rgba(223,252,99,.18)}.chip.used{cursor:default;color:#8fa098;text-decoration:line-through;opacity:.58}.chip.used:hover{transform:none}.mark{display:grid;flex:0 0 auto;width:25px;height:25px;place-items:center;border-radius:8px;background:rgba(255,255,255,.12);color:var(--lime);font-size:14px;text-decoration:none}
    @media(max-width:840px){.page{width:min(100% - 22px,720px);padding-top:28px}.hero{align-items:flex-start}.workspace{display:flex;flex-direction:column}.bank{position:static;order:-1;width:100%}.words{display:flex;max-height:none;overflow-x:auto;padding-bottom:15px}.chip{flex:0 0 auto;width:auto;max-width:270px}}
    @media(max-width:560px){.page{width:min(100% - 16px,520px);padding:22px 0 44px}.hero{gap:12px;margin-bottom:18px}h1{font-size:43px}.intro{font-size:14px}.score{min-width:76px;padding:10px 8px;border-radius:14px}.score strong{font-size:18px}.card,.bank{border-radius:20px}.card-head{align-items:flex-start;padding:18px}.card-head>div{align-items:flex-start;flex-direction:column;gap:7px}.mode{padding-top:5px}.sentences{padding:4px 16px}.sentence{grid-template-columns:25px 1fr;gap:5px;padding:14px 0}.line{font-size:17px;line-height:2.35}.gap{width:min(250px,calc(100vw - 86px));margin:0 2px}.actions{padding:18px}.btn{flex:1;padding-inline:10px}.result{margin:0 18px 20px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="hero"><div><p class="eyebrow">Food vocabulary · A2–B1</p><h1>Build the recipe</h1><p class="intro">Drag a phrase into each gap or type your own answer. On a phone, tap a word and then tap a gap.</p></div><div class="score" id="score"><span>Score</span><strong>—/17</strong></div></header>
    <div class="workspace">
      <section class="card"><div class="card-head"><div><span class="pill">01</span><h2>Complete the sentences</h2></div><span class="mode">Drag · tap · type</span></div><ol class="sentences" id="sentences"></ol><div class="actions"><button class="btn primary" id="check">Check answers</button><button class="btn ghost" id="reset">Try again</button></div><div class="result" id="result" aria-live="polite"></div></section>
      <aside class="bank"><div class="bank-head"><div><span class="pill">Word bank</span><h2>Choose a phrase</h2></div><span class="counter" id="counter">0/17</span></div><p class="help">Drag a card, or tap it and then tap a gap.</p><div class="words" id="words"></div></aside>
    </div>
  </main>
  <script>
    const data=[
      ["I often stop at a café ___ before work.","to get coffee to go",["to get a coffee to go"]],
      ["In Britain, you might ask ___ instead.","to get a takeaway coffee",["to get takeaway coffee"]],
      ["My grandma makes delicious ___ with rice and vegetables.","cabbage rolls"],
      ["Remember ___ the potatoes before you mash them.","to boil"],
      ["She poured some ___ into the cake mixture.","condensed milk"],
      ["In Ukraine, ___ is often called salo.","pork fat / salo",["pork fat","salo"]],
      ["Use a blender ___ until they are smooth.","to blend the strawberries"],
      ["Don’t forget ___ a pinch of salt.","to add"],
      ["Use a mixer ___ until it is light and fluffy.","to whip cream",["to whip the cream","whipped cream"]],
      ["Sprinkle some ___ on top of the dessert.","powdered sugar",["icing sugar"]],
      ["Children sometimes like ___ before eating them.","to dip the cookies in milk",["to dip cookies in milk"]],
      ["I ordered a burger with ___ on the side.","French fries",["fries"]],
      ["I added an ___ to each cookie.","almond"],
      ["This chocolate spread contains roasted ___ .","hazelnuts"],
      ["A ___ looks a little like a tiny brain.","walnut"],
      ["Sprinkle the cake with ___ before serving.","chopped nuts"],
      ["Use a sharp knife ___ the nuts finely.","to chop"]
    ];
    const S={answers:Array(data.length).fill(""),selected:null,checked:false};
    const norm=s=>(s||"").toLowerCase().replace(/[’']/g,"'").replace(/[.,!?]/g,"").replace(/\s*\/\s*/g," / ").replace(/\s+/g," ").trim();
    const correct=i=>[data[i][1],...(data[i][2]||[])].map(norm).includes(norm(S.answers[i]));
    function setAnswer(i,value){S.answers[i]=value;S.selected=null;S.checked=false;render()}
    function render(){
      const used=new Set();S.answers.forEach(v=>{const i=data.findIndex(x=>norm(x[1])===norm(v));if(i>-1)used.add(i)});
      document.querySelector('#sentences').innerHTML=data.map((x,i)=>{const [a,b]=x[0].split('___'),has=!!S.answers[i],ok=S.checked&&correct(i),bad=S.checked&&!ok;return `<li class="sentence"><span class="num">${String(i+1).padStart(2,'0')}</span><div class="line"><span>${a}</span><span class="gap ${ok?'correct':''} ${bad?'wrong':''}" data-gap="${i}"><input aria-label="Answer ${i+1}" value="${S.answers[i].replace(/&/g,'&amp;').replace(/"/g,'&quot;')}" placeholder="${S.selected!==null?'Tap to place':'Type or drop here'}">${has?'<button class="clear" aria-label="Clear answer">×</button>':''}</span><span>${b}</span>${bad?`<span class="correction">Correct: ${x[1]}</span>`:''}</div></li>`}).join('');
      document.querySelector('#words').innerHTML=data.map((x,i)=>`<button class="chip ${used.has(i)?'used':''} ${S.selected===i?'selected':''}" draggable="${!used.has(i)}" data-word="${i}"><span>${x[1]}</span><span class="mark">${used.has(i)?'✓':S.selected===i?'→':'+'}</span></button>`).join('');
      document.querySelector('#counter').textContent=`${used.size}/${data.length}`;
      document.querySelectorAll('[data-gap]').forEach(g=>{const i=+g.dataset.gap;g.addEventListener('click',e=>{if(e.target.classList.contains('clear')){e.stopPropagation();setAnswer(i,'')}else if(S.selected!==null)setAnswer(i,data[S.selected][1])});g.addEventListener('dragover',e=>e.preventDefault());g.addEventListener('drop',e=>{e.preventDefault();setAnswer(i,data[+e.dataTransfer.getData('text')][1])});g.querySelector('input').addEventListener('input',e=>{S.answers[i]=e.target.value;S.checked=false;updateScore()})});
      document.querySelectorAll('[data-word]').forEach(c=>{const i=+c.dataset.word;if(!used.has(i)){c.addEventListener('click',()=>{S.selected=S.selected===i?null:i;render()});c.addEventListener('dragstart',e=>e.dataTransfer.setData('text',i))}});
      updateScore();
    }
    function updateScore(){const score=data.filter((_,i)=>correct(i)).length,box=document.querySelector('#score'),result=document.querySelector('#result');box.classList.toggle('active',S.checked);box.querySelector('strong').textContent=S.checked?`${score}/${data.length}`:`—/${data.length}`;result.className='result'+(S.checked?' show':'')+(score===data.length?' perfect':'');result.textContent=S.checked?(score===data.length?'Perfect! Every answer is correct.':`You got ${score} out of ${data.length}. Review the highlighted gaps and try again.`):''}
    document.querySelector('#check').onclick=()=>{S.checked=true;render()};document.querySelector('#reset').onclick=()=>{S.answers.fill('');S.selected=null;S.checked=false;render()};render();
  </script>
</body>
</html>
